[project]
name = "pos-erp-v6"
version = "0.2.0"
description = "POS-ERP Integration Engine V6 — Modular monolith for salon & wellness businesses"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Beauty & Shine Development Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Office/Business",
]

[project.urls]
Repository = "https://github.com/your-org/pos-erp-v6"
Documentation = "https://github.com/your-org/pos-erp-v6/tree/main/docs"
Issues = "https://github.com/your-org/pos-erp-v6/issues"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "psycopg[binary]>=3.1",
    "pydantic>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

# ── Ruff ────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
    "N802",   # function name should be lowercase (some DB helpers)
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
]

[tool.ruff.lint.isort]
known-first-party = ["pos_erp"]

[tool.ruff.format]
quote-style = "double"

# ── Mypy ────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true
plugins = ["pydantic.mypy"]

# ── Pytest ──────────────────────────────────────────

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 30
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring database",
]

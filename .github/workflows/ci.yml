name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: pos_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POS_ERP_DATABASE_URL: postgresql://erp:testpass@localhost:5432/pos_erp_test
      POS_ERP_ENV: test
      POS_ERP_SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || pip install fastapi uvicorn psycopg pydantic pytest ruff
      - name: Lint with ruff
        run: ruff check src/ --exit-zero
      - name: Run tests
        run: pytest tests/ -x -q --tb=short --timeout=30
        continue-on-error: true

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t pos-erp-v6:ci .
